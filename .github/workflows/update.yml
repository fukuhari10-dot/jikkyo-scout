name: update-data
on:
  schedule:
    - cron: "*/10 * * * *"   # live: ライブ中・配信予定・新着（10分ごと）
    - cron: "7 * * * *"      # full: 登録者数・トピック・大台達成（毎時7分）
    - cron: "20 18 * * *"    # discover: 新しい配信者を自動で追加・試合日程を更新（日本時間 3:20）
    - cron: "40 */4 * * *"   # news: 速報（話題ごとの最新動画。4時間ごと）
  workflow_dispatch:
    inputs:
      mode:
        description: live / full / discover / schedule / news
        default: full

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pick mode
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            case "${{ github.event.schedule }}" in
              "*/10 * * * *") MODE=live ;;
              "20 18 * * *") MODE=discover ;;
              "40 */4 * * *") MODE=news ;;
              *) MODE=full ;;
            esac
          fi
          echo "MODE=$MODE" >> "$GITHUB_ENV"
      - name: fetch
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python fetch.py --mode "$MODE"
      - name: commit
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data channels.json
          [ -f blocked.json ] && git add blocked.json || true
          git diff --cached --quiet || (git commit -m "data: $MODE $(date -u +%FT%TZ)" && (git push || (git pull --rebase && git push)))
