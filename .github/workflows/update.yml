name: update-data
on:
  schedule:
    - cron: "*/10 * * * *"
    - cron: "7 * * * *"
    - cron: "20 18 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: live / full / discover
        default: full

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pick mode
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            case "${{ github.event.schedule }}" in
              "*/10 * * * *") MODE=live ;;
              "20 18 * * *") MODE=discover ;;
              *) MODE=full ;;
            esac
          fi
          echo "MODE=$MODE" >> "$GITHUB_ENV"
      - name: fetch
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python fetch.py --mode "$MODE"
      - name: commit
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "data: $MODE $(date -u +%FT%TZ)" && git push)
